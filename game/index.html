<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dune Brawl test build</title>
<style>
  :root { --bg:#0d0b1a; --ink:#f6efe6; --muted:#b9adc9; --accent:#ff7a45; --card:rgba(20,16,38,.86); --line:rgba(255,255,255,.14); }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow:hidden; }
  canvas { position:fixed; inset:0; width:100vw; height:100vh; display:block; }
  .overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:16px; background:radial-gradient(ellipse at center, rgba(13,11,26,.3), rgba(13,11,26,.85)); }
  .overlay[hidden] { display:none; }
  .card { width:min(620px,100%); background:var(--card); border:1px solid var(--line); border-radius:20px; padding:26px; backdrop-filter:blur(10px); }
  h1 { margin:0 0 4px; font-size:40px; font-weight:900; letter-spacing:-1px; }
  h1 span { color:var(--accent); }
  .sub { color:var(--muted); margin:0 0 18px; }
  .row { margin:10px 0; }
  .row b { display:block; font-size:13px; color:var(--muted); margin-bottom:6px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  button { font:inherit; font-weight:700; border:0; border-radius:12px; padding:12px 16px; cursor:pointer; color:#1a0f08; background:var(--accent); }
  button:focus-visible { outline:3px solid #fff; outline-offset:2px; }
  .chip { background:transparent; color:var(--ink); border:1px solid var(--line); padding:8px 12px; font-size:14px; }
  .chip.on { background:var(--ink); color:#1a0f08; }
  .btns { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:16px; }
  .ghost { background:transparent; color:var(--ink); border:1px solid var(--line); }
  .keys { margin-top:16px; display:grid; grid-template-columns:auto 1fr; gap:4px 14px; font-size:13px; color:var(--muted); }
  kbd { font:600 12px ui-monospace, monospace; background:rgba(255,255,255,.1); border:1px solid var(--line); border-radius:6px; padding:1px 6px; color:var(--ink); }
  #panel { position:fixed; top:12px; right:12px; width:300px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; font-size:12px; }
  #panel label { display:grid; grid-template-columns:90px 1fr 46px; gap:6px; align-items:center; margin-top:6px; }
  #panel button { margin-top:10px; padding:8px 12px; font-size:12px; }
  @media (max-width:560px) { .btns { grid-template-columns:1fr; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="overlay" id="menu" hidden>
  <div class="card">
    <h1>Dune<span>Brawl</span></h1>
    <p class="sub">Test build: new sprites, Dune Island, tuned against the reference footage.</p>
    <div class="row"><b>Player 1</b><div class="chips" id="pick0"></div></div>
    <div class="row"><b>Player 2 / bot</b><div class="chips" id="pick1"></div></div>
    <div class="btns">
      <button id="bBot">Practice vs bot</button>
      <button class="ghost" id="bLocal">2 players, one keyboard</button>
      <button class="ghost" id="bDemo">Watch bot vs bot</button>
    </div>
    <div class="keys">
      <span><kbd>WASD</kbd> / <kbd>Arrows</kbd></span><span>Move and aim</span>
      <span><kbd>Space</kbd></span><span>Jump</span>
      <span><kbd>J</kbd> / <kbd>K</kbd></span><span>Light / heavy (Up + K recovers)</span>
      <span><kbd>L</kbd> / <kbd>Shift</kbd></span><span>Dodge</span>
      <span><kbd>F2</kbd> / <kbd>F3</kbd></span><span>Feel tuning panel / hitboxes</span>
    </div>
  </div>
</div>
<div id="panel" hidden></div>
<script src="sim.js"></script>
<script src="render.js"></script>
<script src="main.js"></script>
</body>
</html>
